services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: businesstalk-ui
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4001
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:4001}
    networks:
      - businesstalk-network

networks:
  businesstalk-network:
    driver: bridge
